name: dcte_kp_teachers
description: "DCTE KP Teachers – Curriculum, Notifications, Documents & Teacher Resources (independent, unofficial)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+7
  firebase_push: ^5.3.1
  cloud_functions: ^5.1.3

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  syncfusion_flutter_pdfviewer: ^32.2.9

  http: ^1.2.2

  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  connectivity_plus: ^6.1.0

  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  crypto: ^1.0.5
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^1.0.4
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true

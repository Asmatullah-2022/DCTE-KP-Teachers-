name: dcte_kp_teachers
description: "DCTE KP Teachers — Curriculum, Notifications, Documents & Teacher Resources (independent, unofficial)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+7
  firebase_auth: ^5.3.1
  cloud_functions: ^5.1.3

  # State management / routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # PDF
  syncfusion_flutter_pdfviewer: ^34.2.6

  # Local caching / storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking / connectivity
  connectivity_plus: ^6.1.0
  http: ^1.2.2

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^12.0.2
  crypto: ^3.0.5
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true

  # No bundled asset files ship in this MVP — the in-app logo is drawn
  # programmatically (see lib/features/home/home_screen.dart). Add real
  # image assets under assets/images/ and declare them here if you swap
  # in a designed logo/icon set.

  # fonts:
  #   - family: NotoNastaliqUrdu
  #     fonts:
  #       - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf

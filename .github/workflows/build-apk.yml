name: Build Android APK

# Runs automatically on pushes/PRs that touch Flutter source, AND supports
# an on-demand manual run (Actions tab -> Build Android APK -> Run workflow)
# for when you just want a fresh APK without pushing a change — this covers
# both "build on every change" and "let me trigger a build myself" in one
# workflow rather than two near-duplicates.
on:
  push:
    branches: ['**']
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optional note for why this build was triggered manually'
        required: false
        default: ''

# Cancel a superseded run on the same branch/PR so pushes don't queue up.
concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: flutter analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required by the Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # This repo intentionally ships without android/ (see README §1/§3) —
      # a working Gradle project, including the binary gradle-wrapper.jar,
      # can't be hand-authored reliably. Generate it here if it isn't
      # already committed (e.g. once you run `flutter create .` locally and
      # commit android/ yourself, this step becomes a no-op and your
      # committed platform config is used instead).
      - name: Generate android/ platform folder if missing
        run: |
          if [ ! -d android ]; then
            echo "No android/ directory found — running 'flutter create .' to generate it."
            flutter create . --org pk.gov.kp.dcte --project-name dcte_kp_teachers --platforms=android
          else
            echo "android/ already exists — using the committed platform config."
          fi

      # `flutter create`'s default compileSdk (whatever this Flutter version's
      # template picks, e.g. 31) is too low for modern plugin AARs.
      # syncfusion_flutter_pdfviewer, shared_preferences_android,
      # sqflite_android, url_launcher_android, and androidx.core:1.17.0 all
      # require compiling against API 36 (confirmed via
      # :app:checkReleaseAarMetadata / :syncfusion_flutter_pdfviewer:
      # checkReleaseAarMetadata's "compile against version 36 or later"
      # errors — Gradle's own recommended action is "compileSdk of at least
      # 36, for example 36").
      #
      # A first attempt sed-replaced the literal line
      # `compileSdk = flutter.compileSdkVersion` — that step reported
      # success (something in the file did change, confirmed by its own
      # diff check), but the actual Gradle build still resolved compileSdk
      # to 31 (CI run 33721552186), meaning the real compileSdk assignment
      # in THIS Flutter version's generated template uses different syntax
      # than assumed, and only the targetSdk line (or some other line)
      # matched. Rather than guess again at the exact internal syntax,
      # this step dumps the generated android{} block for diagnosis and
      # then UNCONDITIONALLY overrides compileSdk/targetSdk by appending
      # direct property assignments at the very end of the build script.
      # Gradle executes top-level script statements in file order, so an
      # assignment appended after the android {} block always wins over
      # whatever that block set, regardless of how it was originally
      # written (a literal number, `flutter.compileSdkVersion`, a version
      # catalog reference, etc.) — this does not depend on matching any
      # particular line format.
      - name: Force compileSdk/targetSdk to 36 for modern plugin AARs
        run: |
          set -e
          KTS="android/app/build.gradle.kts"
          GROOVY="android/app/build.gradle"

          if [ -f "$KTS" ]; then
            FILE="$KTS"
            IS_KTS=1
          elif [ -f "$GROOVY" ]; then
            FILE="$GROOVY"
            IS_KTS=0
          else
            echo "::error::Neither $KTS nor $GROOVY exists after android/ generation."
            exit 1
          fi

          echo "Generated $FILE — android block as written by 'flutter create':"
          grep -nE "compileSdk|targetSdk|namespace" "$FILE" || echo "(no compileSdk/targetSdk/namespace lines found — template structure may differ further)"

          if [ "$IS_KTS" = "1" ]; then
            {
              echo ""
              echo "// --- CI override: force compileSdk/targetSdk to 36 (see build-apk.yml for why) ---"
              echo "android.compileSdk = 36"
              echo "android.defaultConfig.targetSdk = 36"
            } >> "$FILE"
          else
            {
              echo ""
              echo "// --- CI override: force compileSdk/targetSdk to 36 (see build-apk.yml for why) ---"
              echo "android.compileSdkVersion 36"
              echo "android.defaultConfig.targetSdkVersion 36"
            } >> "$FILE"
          fi

          echo "Appended override. Final $FILE tail:"
          tail -n 6 "$FILE"

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test

      # NOTE ON FIREBASE CONFIG: lib/config/firebase_options.dart ships with
      # PLACEHOLDER values (see that file and README §6) until you run
      # `flutterfire configure` with your own Firebase project. This
      # workflow builds the APK as-is — it compiles and installs fine, but
      # won't actually reach Firebase at runtime until you replace that
      # file with real config (either by committing it — only do this for
      # a private repo, since it's not a secret-free file to publish widely
      # — or by wiring it in as a repo secret restored by an extra step
      # here). This is a real limitation, not a bug: CI can't know your
      # Firebase project for you.
      - name: flutter build apk --release
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcte-kp-teachers-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

name: Build Android APK

# Runs automatically on pushes/PRs that touch Flutter source, AND supports
# an on-demand manual run (Actions tab -> Build Android APK -> Run workflow)
# for when you just want a fresh APK without pushing a change — this covers
# both "build on every change" and "let me trigger a build myself" in one
# workflow rather than two near-duplicates.
on:
  push:
    branches: ['**']
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optional note for why this build was triggered manually'
        required: false
        default: ''

# Cancel a superseded run on the same branch/PR so pushes don't queue up.
concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: flutter analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required by the Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # This repo intentionally ships without android/ (see README §1/§3) —
      # a working Gradle project, including the binary gradle-wrapper.jar,
      # can't be hand-authored reliably. Generate it here if it isn't
      # already committed (e.g. once you run `flutter create .` locally and
      # commit android/ yourself, this step becomes a no-op and your
      # committed platform config is used instead).
      - name: Generate android/ platform folder if missing
        run: |
          if [ ! -d android ]; then
            echo "No android/ directory found — running 'flutter create .' to generate it."
            flutter create . --org pk.gov.kp.dcte --project-name dcte_kp_teachers --platforms=android
          else
            echo "android/ already exists — using the committed platform config."
          fi

      # ROOT CAUSE (confirmed with hard evidence from CI run 33722612202,
      # not guessed): patching android/app/build.gradle.kts — however
      # correctly done, sed or direct append, both verified in that run's
      # own log to have actually landed in the file — can only ever change
      # the APP MODULE's own compileSdk. The failing task
      # ':syncfusion_flutter_pdfviewer:checkReleaseAarMetadata' belongs to
      # a DIFFERENT Gradle subproject: syncfusion_flutter_pdfviewer's own
      # build.gradle, bundled inside the plugin package under the pub-cache
      # (not anything in this repo's android/ tree), which independently
      # reads the identical `flutter.compileSdkVersion` / `flutter.
      # targetSdkVersion` properties. Editing app/build.gradle.kts can
      # never reach that separate file, no matter how the edit is made —
      # which is exactly why every previous attempt (sed match, verified
      # append) left the syncfusion subproject still compiling against
      # android-31 while only ever touching :app's own value.
      #
      # The correct, Flutter-supported single point of control is
      # android/local.properties: every Flutter-plugin-generated
      # build.gradle (app's AND every plugin's, syncfusion included) reads
      # its compileSdk/targetSdk from the SAME shared `flutter.
      # compileSdkVersion`/`flutter.targetSdkVersion` properties, resolved
      # by the Flutter Gradle plugin loader from local.properties when
      # present. Setting it there — once — propagates uniformly to every
      # subproject in the build, which no per-file edit can do.
      - name: Set flutter.compileSdkVersion/targetSdkVersion=36 in local.properties
        run: |
          set -e
          LOCAL_PROPS="android/local.properties"
          touch "$LOCAL_PROPS"

          echo "android/local.properties before:"
          cat "$LOCAL_PROPS"

          grep -v -E '^flutter\.(compileSdkVersion|targetSdkVersion)=' "$LOCAL_PROPS" > "$LOCAL_PROPS.tmp" || true
          mv "$LOCAL_PROPS.tmp" "$LOCAL_PROPS"
          {
            echo "flutter.compileSdkVersion=36"
            echo "flutter.targetSdkVersion=36"
          } >> "$LOCAL_PROPS"

          echo "android/local.properties after:"
          cat "$LOCAL_PROPS"

          echo "----- For reference, the generated app/build.gradle.kts (unmodified) reads: -----"
          grep -nE "compileSdk|targetSdk|namespace" android/app/build.gradle.kts 2>/dev/null \
            || grep -nE "compileSdk|targetSdk" android/app/build.gradle 2>/dev/null \
            || echo "(neither build.gradle.kts nor build.gradle found under android/app)"

          echo "----- Verifying the override landed in local.properties (hard fail if not) -----"
          grep -q "^flutter.compileSdkVersion=36$" "$LOCAL_PROPS"
          grep -q "^flutter.targetSdkVersion=36$" "$LOCAL_PROPS"
          echo "OK: flutter.compileSdkVersion=36 and flutter.targetSdkVersion=36 confirmed in $LOCAL_PROPS"

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test

      # NOTE ON FIREBASE CONFIG: lib/config/firebase_options.dart ships with
      # PLACEHOLDER values (see that file and README §6) until you run
      # `flutterfire configure` with your own Firebase project. This
      # workflow builds the APK as-is — it compiles and installs fine, but
      # won't actually reach Firebase at runtime until you replace that
      # file with real config (either by committing it — only do this for
      # a private repo, since it's not a secret-free file to publish widely
      # — or by wiring it in as a repo secret restored by an extra step
      # here). This is a real limitation, not a bug: CI can't know your
      # Firebase project for you.
      # Final print-and-verify immediately before the real build, so the CI
      # log shows exactly what Gradle is about to see rather than trusting
      # an earlier step's own success message.
      - name: Verify compileSdk override before building
        run: |
          set -e
          echo "===== android/local.properties ====="
          cat android/local.properties

          echo "===== ACTUAL ANDROID BUILD FILE (android/app) ====="
          cat android/app/build.gradle.kts 2>/dev/null || true
          cat android/app/build.gradle 2>/dev/null || true

          echo "===== grep -R compileSdk android ====="
          grep -R "compileSdk" android || true

          echo "===== grep -R targetSdk android ====="
          grep -R "targetSdk" android || true

          grep -q "^flutter.compileSdkVersion=36$" android/local.properties || {
            echo "::error::flutter.compileSdkVersion=36 missing from android/local.properties — refusing to build."
            exit 1
          }

      - name: flutter build apk --release
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcte-kp-teachers-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

name: Build Android APK

# Runs automatically on pushes/PRs that touch Flutter source, AND supports
# an on-demand manual run (Actions tab -> Build Android APK -> Run workflow)
# for when you just want a fresh APK without pushing a change — this covers
# both "build on every change" and "let me trigger a build myself" in one
# workflow rather than two near-duplicates.
on:
  push:
    branches: ['**']
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optional note for why this build was triggered manually'
        required: false
        default: ''

# Cancel a superseded run on the same branch/PR so pushes don't queue up.
concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: flutter analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required by the Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # This repo intentionally ships without android/ (see README §1/§3) —
      # a working Gradle project, including the binary gradle-wrapper.jar,
      # can't be hand-authored reliably. Generate it here if it isn't
      # already committed (e.g. once you run `flutter create .` locally and
      # commit android/ yourself, this step becomes a no-op and your
      # committed platform config is used instead).
      - name: Generate android/ platform folder if missing
        run: |
          if [ ! -d android ]; then
            echo "No android/ directory found — running 'flutter create .' to generate it."
            flutter create . --org pk.gov.kp.dcte --project-name dcte_kp_teachers --platforms=android
          else
            echo "android/ already exists — using the committed platform config."
          fi

      # Directly replace the literal compileSdk/targetSdk lines in the
      # generated app module (confirmed exact text via CI log inspection:
      # `compileSdk = flutter.compileSdkVersion` / `targetSdk = flutter.
      # targetSdkVersion` in android/app/build.gradle.kts) with hardcoded
      # 36. This fixes the APP module directly, no append, no separate
      # verification step — the replacement itself hard-fails if the
      # expected line isn't found. Also sets the same values in
      # android/local.properties for any plugin subproject that does read
      # them from there.
      - name: Set compileSdk/targetSdk to 36
        run: |
          set -e
          KTS="android/app/build.gradle.kts"
          GROOVY="android/app/build.gradle"
          FILE="$KTS"
          [ -f "$FILE" ] || FILE="$GROOVY"

          cp "$FILE" "$FILE.bak"

          # Exact literal-text replacement (dot escaped, no regex ambiguity —
          # confirmed exact source text via CI log inspection of the
          # generated file, not guessed).
          sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' "$FILE"
          sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 36/' "$FILE"
          sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' "$FILE"
          sed -i 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 36/' "$FILE"

          if diff -q "$FILE" "$FILE.bak" > /dev/null; then
            echo "::error::compileSdk/targetSdk line not found in $FILE — cannot proceed."
            cat "$FILE"
            exit 1
          fi
          rm "$FILE.bak"

          echo "----- Resulting $FILE compileSdk/targetSdk lines -----"
          grep -nE "compileSdk|targetSdk" "$FILE"

          # Confirm the SPECIFIC target lines landed, not just that
          # something in the file changed — that ambiguity is exactly
          # what let an earlier attempt silently patch the wrong line.
          grep -qE "compileSdk(Version)?[[:space:]]*=?[[:space:]]*36" "$FILE" || { echo "::error::compileSdk was not set to 36 in $FILE"; exit 1; }
          grep -qE "targetSdk(Version)?[[:space:]]*=?[[:space:]]*36" "$FILE" || { echo "::error::targetSdk was not set to 36 in $FILE"; exit 1; }
          echo "OK: compileSdk and targetSdk confirmed as 36 in $FILE"

          LOCAL_PROPS="android/local.properties"
          touch "$LOCAL_PROPS"
          grep -v -E '^flutter\.(compileSdkVersion|targetSdkVersion)=' "$LOCAL_PROPS" > "$LOCAL_PROPS.tmp" || true
          mv "$LOCAL_PROPS.tmp" "$LOCAL_PROPS"
          {
            echo "flutter.compileSdkVersion=36"
            echo "flutter.targetSdkVersion=36"
          } >> "$LOCAL_PROPS"

      - name: flutter pub get
        run: flutter pub get

      # syncfusion_flutter_pdfviewer-29.2.11's OWN android/build.gradle
      # (bundled inside the package under the pub-cache, fetched by the
      # previous step) hardcodes `compileSdkVersion 31` as a literal
      # number — confirmed by directly printing this file's real content
      # in CI (run 33724847311). It has no reference to
      # flutter.compileSdkVersion at all, which is exactly why neither
      # editing android/app/build.gradle.kts nor setting local.properties
      # could ever change it: there is no indirection there to override.
      # Patch the literal value directly in the pub-cache copy.
      - name: Patch syncfusion_flutter_pdfviewer's hardcoded compileSdkVersion
        run: |
          set -e
          PKG_DIR=$(find "$PUB_CACHE" -maxdepth 4 -type d -iname "syncfusion_flutter_pdfviewer-*" 2>/dev/null | sort | tail -n1)
          if [ -z "$PKG_DIR" ]; then
            echo "::error::Could not locate syncfusion_flutter_pdfviewer under PUB_CACHE after pub get."
            exit 1
          fi
          GRADLE_FILE="$PKG_DIR/android/build.gradle"

          sed -i 's/compileSdkVersion 31/compileSdkVersion 36/' "$GRADLE_FILE"

          grep -qE "compileSdkVersion 36" "$GRADLE_FILE" || {
            echo "::error::compileSdkVersion 36 not confirmed in $GRADLE_FILE after patch."
            cat "$GRADLE_FILE"
            exit 1
          }
          echo "OK: $GRADLE_FILE now has compileSdkVersion 36"

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test

      # NOTE ON FIREBASE CONFIG: lib/config/firebase_options.dart ships with
      # PLACEHOLDER values (see that file and README §6) until you run
      # `flutterfire configure` with your own Firebase project. This
      # workflow builds the APK as-is — it compiles and installs fine, but
      # won't actually reach Firebase at runtime until you replace that
      # file with real config (either by committing it — only do this for
      # a private repo, since it's not a secret-free file to publish widely
      # — or by wiring it in as a repo secret restored by an extra step
      # here). This is a real limitation, not a bug: CI can't know your
      # Firebase project for you.
      - name: flutter build apk --release
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcte-kp-teachers-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
